
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #1d4ed8;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Marks Calculator</h1>
        <input type="number" id="sub1" placeholder="Subject 1 Marks (out of 100)">
        <input type="number" id="sub2" placeholder="Subject 2 Marks (out of 100)">
        <input type="number" id="sub3" placeholder="Subject 3 Marks (out of 100)">
        <input type="number" id="sub4" placeholder="Subject 4 Marks (out of 100)">
        <input type="number" id="sub5" placeholder="Subject 5 Marks (out of 100)">
        <br>
        <button onclick="calculate()">Calculate Result</button>
        <div id="result"></div>
    </div>

    <script>
        function calculate() {
            let s1 = Number(document.getElementById("sub1").value) || 0;
            let s2 = Number(document.getElementById("sub2").value) || 0;
            let s3 = Number(document.getElementById("sub3").value) || 0;
            let s4 = Number(document.getElementById("sub4").value) || 0;
            let s5 = Number(document.getElementById("sub5").value) || 0;

            let total = s1 + s2 + s3 + s4 + s5;
            let percentage = (total / 500) * 100;

            let grade;
            if (percentage >= 90) grade = "A+";
            else if (percentage >= 80) grade = "A";
            else if (percentage >= 70) grade = "B";
            else if (percentage >= 60) grade = "C";
            else if (percentage >= 50) grade = "D";
            else grade = "F";

            document.getElementById("result").innerHTML = 
                `Total Marks: ${total}/500<br>
                 Percentage: ${percentage.toFixed(2)}%<br>
                 Grade: ${grade}`;
        }
    </script>
</body>
</html>
